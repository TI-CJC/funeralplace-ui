<!-- Modal -->
<div
  data-te-modal-init
  class="fixed left-0 top-32 z-[1055] hidden h-full w-full overflow-y-auto overflow-x-hidden outline-none"
  id="{{nomeModal}}"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div
    data-te-modal-dialog-ref
    class="pointer-events-none relative w-auto translate-y-[-50px] opacity-0 transition-all duration-300 ease-in-out min-[576px]:mx-auto min-[576px]:mt-7 min-[576px]:max-w-[500px]">
    <div
      class="min-[576px]:shadow-[0_0.5rem_1rem_rgba(#000, 0.15)] pointer-events-auto relative flex w-full flex-col rounded-md border-none bg-white bg-clip-padding text-current shadow-lg outline-none dark:bg-neutral-600">
      <div
        class="flex flex-shrink-0 items-center justify-between rounded-t-md border-b-2 border-neutral-100 border-opacity-100 p-4 dark:border-opacity-50">
        <!--Modal title-->
        <h5
          class="text-xl font-medium leading-normal text-primaryGreen"
          id="exampleModalLabel">
          Preencha os campos abaixo para que um de nossos consultores entre em contato com você e te auxilie:
        </h5>
        <!--Close button-->

        <button
          type="button"
          class="box-content rounded-none border-none hover:no-underline hover:opacity-75 focus:opacity-100 focus:shadow-none focus:outline-none"
          data-te-modal-dismiss
          aria-label="Close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="h-6 w-6">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!--Modal body-->
      <div class="relative flex-auto p-4" data-te-modal-body-ref>
        <form [formGroup]="formContato" class="flex flex-col">
          <div class="relative mb-4 flex flex-wrap items-stretch">
            <span
              class="flex items-center whitespace-nowrap rounded-l border border-r-0 border-solid border-neutral-300 px-3 py-[0.25rem] text-center text-base font-normal leading-[1.6] text-neutral-700 dark:border-neutral-600 dark:text-neutral-200 dark:placeholder:text-neutral-200"
              id="inputGroup-sizing-default"
              >Nome</span
            >
            <input
              type="text"
              class="relative m-0 block w-[1px] min-w-0 flex-auto rounded-r border border-solid border-neutral-300 bg-white bg-clip-padding px-3 py-[0.50rem] text-base font-normal leading-[1.6] text-neutral-700 outline-none transition duration-200 ease-in-out focus:z-[3] focus:border-primaryGreen focus:text-neutral-700"
              placeholder="Digite seu nome completo"
              aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default"
              formControlName="name"
              />
          </div>
          <div class="relative mb-4 flex flex-wrap items-stretch">
            <span
              class="flex items-center whitespace-nowrap rounded-l border border-r-0 border-solid border-neutral-300 px-3 py-[0.25rem] text-center text-base font-normal leading-[1.6] text-neutral-700 dark:border-neutral-600 dark:text-neutral-200 dark:placeholder:text-neutral-200"
              id="inputGroup-sizing-default"
              >Email</span
            >
            <input
              type="text"
              class="relative m-0 block w-[1px] min-w-0 flex-auto rounded-r border border-solid border-neutral-300 bg-white bg-clip-padding px-3 py-[0.50rem] text-base font-normal leading-[1.6] text-neutral-700 outline-none transition duration-200 ease-in-out focus:z-[3] focus:border-primaryGreen focus:text-neutral-700"
              placeholder="Digite seu Email"
              aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default"
              formControlName="email"
              />
          </div>
          <div class="relative mb-4 flex flex-wrap items-stretch">
            <span
              class="flex items-center whitespace-nowrap rounded-l border border-r-0 border-solid border-neutral-300 px-3 py-[0.25rem] w-[85px] text-center text-base font-normal leading-[1.6] text-neutral-700 dark:border-neutral-600 dark:text-neutral-200 dark:placeholder:text-neutral-200"
              id="inputGroup-sizing-default"
              >Telefone</span
            >
            <input
              type="text"
              class="relative m-0 block w-[1px] min-w-0 flex-auto rounded-r border border-solid border-neutral-300 bg-white bg-clip-padding px-3 py-[0.50rem] text-base font-normal leading-[1.6] text-neutral-700 outline-none transition duration-200 ease-in-out focus:z-[3] focus:border-primaryGreen focus:text-neutral-700"
              placeholder="Digite seu telefone"
              aria-label="Sizing example input"
              aria-describedby="inputGroup-sizing-default"
              formControlName="phone"
              />
          </div>
          <div class="relative mb-4 flex flex-wrap items-stretch">
            <span
              class="flex items-center whitespace-nowrap rounded-l border border-r-0 border-solid border-neutral-300 px-3 py-[0.25rem] w-[85px] text-center text-base font-normal leading-[1.6] text-neutral-700 dark:border-neutral-600 dark:text-neutral-200 dark:placeholder:text-neutral-200"
              id="inputGroup-sizing-default"
              >Assunto</span
            >
            <input
              type="text"
              class="relative m-0 block w-[1px] min-w-0 flex-auto rounded-r border border-solid border-neutral-300 bg-white bg-clip-padding px-3 py-[0.50rem] text-base font-normal leading-[1.6] text-neutral-700 outline-none transition duration-200 ease-in-out focus:z-[3] focus:border-primaryGreen focus:text-neutral-700"
              placeholder="Digite assunto do contato"
              aria-label="Sizing example input"
              formControlName="assunto"
              aria-describedby="inputGroup-sizing-default" />
          </div>

          <div class="relative mb-4 flex ">
            <textarea
            type="text"
            class="form-control block w-full h-[90px] px-3 py-0.5 font-normal text-gray-700 bg-white bg-clip-padding border border-solid border-gray-300 rounded outline-none transition duration-200 ease-in-out focus:z-[3] focus:border-primaryGreen focus:text-neutral-700"
            formControlName="mensagem"
            placeholder="Digite aqui a menssagem"
          ></textarea>
          </div>
        </form>
      </div>

      <!--Modal footer-->
      <div
        class="flex flex-shrink-0 flex-wrap items-center justify-end rounded-b-md border-t-2 border-neutral-100 border-opacity-100 p-4 dark:border-opacity-50">
        <button
          *ngIf="statusEmail === ''"
          type="button"
          class="ml-1 inline-block rounded bg-primaryGreen px-6 pb-2 pt-2.5 w-full text-xs font-medium uppercase leading-normal text-white shadow-[0_4px_9px_-4px_#3b71ca] transition duration-150 ease-in-out hover:bg-green-950 hover:shadow-[0_8px_9px_-4px_rgba(59,113,202,0.3),0_4px_18px_0_rgba(59,113,202,0.2)]"
          data-te-ripple-init
          data-te-ripple-color="light"
          (click)="sendEmail()"
          >
          Enviar

        </button>
        <button
          *ngIf="statusEmail === 'enviando'"
          type="button"
          class="flex justify-center ml-1 rounded bg-primaryGreen px-6 pb-2 pt-2.5 w-full text-xs font-medium uppercase leading-normal text-white shadow-[0_4px_9px_-4px_#3b71ca] transition duration-150 ease-in-out hover:bg-green-950 hover:shadow-[0_8px_9px_-4px_rgba(59,113,202,0.3),0_4px_18px_0_rgba(59,113,202,0.2)]"
          data-te-ripple-init
          data-te-ripple-color="light"
          >
          <svg class="mr-2 mt-0.5 animate-spin" width="12px" height="12px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="none">

            <g fill="#F7F7F7" fill-rule="evenodd" clip-rule="evenodd">

            <path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8z" opacity=".2"/>

            <path d="M7.25.75A.75.75 0 018 0a8 8 0 018 8 .75.75 0 01-1.5 0A6.5 6.5 0 008 1.5a.75.75 0 01-.75-.75z"/>

            </g>

          </svg>
          Enviando

        </button>
        <button
          *ngIf="statusEmail === 'enviado'"
          type="button"
          class="flex justify-center ml-1 rounded bg-primaryGreen px-6 pb-2 pt-2.5 w-full text-xs font-medium uppercase leading-normal text-white shadow-[0_4px_9px_-4px_#3b71ca] transition duration-150 ease-in-out hover:bg-green-950 hover:shadow-[0_8px_9px_-4px_rgba(59,113,202,0.3),0_4px_18px_0_rgba(59,113,202,0.2)]"
          data-te-ripple-init
          data-te-ripple-color="light"
          >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 -mt-0.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
          Enviado

        </button>
        <div *ngIf="statusEmail === 'enviado'" class="h-10 w-full mt-2 border-[1px] border-primaryGreen ml-1 rounded-md flex justify-center items-center">
          <div class="text-center text-primaryGreen">Obrigado pelo contato logo iremos te retornar!</div>
        </div>
      </div>
    </div>
  </div>
</div>
