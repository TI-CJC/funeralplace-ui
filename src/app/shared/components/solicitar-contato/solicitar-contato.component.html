<div class="w-full bg-primaryGreen py-12">
  <div class="flex justify-center">
    <div class="flex flex-col">
      <div class="text-center text-white text-2xl">
        Quer receber uma cotação personalizada?
      </div>
      <div class="text-center text-white text-lg mt-4">
        Clique no botão abaixo e solicite o contato de um consultor
      </div>
      <button
        class="bg-green-800 hover:bg-yellow-500 duration-200 w-[160px] mx-auto py-3 text-white mt-4"
        data-te-toggle="modal"
        data-te-target="#modal"
        data-te-ripple-init
        data-te-ripple-color="light">
        Solicitar contato
      </button>
    </div>
  </div>
</div>
<app-contato [nomeModal]="nomeModal"></app-contato>
